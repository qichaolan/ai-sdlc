name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Tests and coverage
        run: >-
          uv run pytest -q --cov --cov-branch
          --cov-report=term-missing --cov-report=json
      - name: Coverage gate (branch and function)
        run: uv run python scripts/check_coverage.py --min 90
      # Uncomment if the project has a Dockerfile.
      # - name: Build
      #   run: docker build -t app:ci .

  # Delete this job if the project doesn't use OpenSpec.
  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate specs and changes
        # Pin the version the project uses locally (openspec --version).
        run: >-
          npx --yes @fission-ai/openspec@<version>
          validate --all --strict --no-interactive
